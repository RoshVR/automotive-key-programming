version: '3.8'

services:
  # Aplicación Node.js
  app:
    build: .
    container_name: automotive-keys-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=automotive_keys
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_APPOINTMENT_WEBHOOK=${N8N_APPOINTMENT_WEBHOOK}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: automotive-keys-db
    environment:
      - POSTGRES_DB=automotive_keys
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # Redis (para caché y sesiones)
  redis:
    image: redis:7-alpine
    container_name: automotive-keys-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  # N8N
  n8n:
    image: n8nio/n8n
    container_name: automotive-keys-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}
      - GENERIC_TIMEZONE=America/Mexico_City
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - app-network

  # Chatwoot
  chatwoot-postgres:
    image: postgres:14-alpine
    container_name: chatwoot-postgres
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  chatwoot-redis:
    image: redis:7-alpine
    container_name: chatwoot-redis
    volumes:
      - chatwoot_redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot
    ports:
      - "3001:3000"
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE}
      - POSTGRES_HOST=chatwoot-postgres
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://chatwoot-redis:6379
      - FRONTEND_URL=https://${CHATWOOT_HOST}
      - FORCE_SSL=true
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    restart: unless-stopped
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: automotive-keys-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - app
      - n8n
      - chatwoot
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  chatwoot_postgres_data:
  chatwoot_redis_data:

networks:
  app-network:
    driver: bridge
