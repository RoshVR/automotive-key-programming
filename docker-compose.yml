version: '3.8'

services:
  # Aplicación Node.js
  app:
    build: .
    container_name: automotive-keys-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=automotive_keys
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_APPOINTMENT_WEBHOOK=${N8N_APPOINTMENT_WEBHOOK}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: automotive-keys-db
    environment:
      - POSTGRES_DB=automotive_keys
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # Redis (para caché y sesiones)
  redis:
    image: redis:7-alpine
    container_name: automotive-keys-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  # N8N
  n8n:
    image: n8nio/n8n
    container_name: automotive-keys-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}
      - GENERIC_TIMEZONE=America/Mexico_City
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - app-network

  # Chatwoot
  chatwoot-postgres:
    image: pgvector/pgvector:pg14
    container_name: chatwoot-postgres
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  chatwoot-redis:
    image: redis:7-alpine
    container_name: chatwoot-redis
    volumes:
      - chatwoot_redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    ports:
      - "3001:3000"
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE}
      - POSTGRES_HOST=chatwoot-postgres
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://chatwoot-redis:6379
      - FRONTEND_URL=http://${CHATWOOT_HOST}
      - FORCE_SSL=false
      - RAILS_LOG_TO_STDOUT=true
      - USE_INBOX_AVATAR_FOR_BOT=true
      - ACTIVE_STORAGE_SERVICE=local
      - REDIS_OPENSSL_VERIFY_MODE=none
      - ENABLE_WEBHOOK_VERIFICATION=false
      - ALLOWED_WEBHOOK_URLS=http://172.18.0.2:5678,http://localhost:5678,http://n8n:5678
      # SMTP Configuration (opcional)
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION}
      - MAILER_SENDER_EMAIL=${SMTP_USERNAME}
    depends_on:
      chatwoot-postgres:
        condition: service_started
      chatwoot-redis:
        condition: service_started
    volumes:
      - chatwoot_storage:/app/storage
    restart: unless-stopped
    networks:
      - app-network

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot-sidekiq
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE}
      - POSTGRES_HOST=chatwoot-postgres
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://chatwoot-redis:6379
      - REDIS_OPENSSL_VERIFY_MODE=none
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
      - chatwoot
    volumes:
      - chatwoot_storage:/app/storage
    restart: unless-stopped
    networks:
      - app-network

  # PostgreSQL para N8N Workflow (memoria de conversaciones)
  n8n-postgres:
    image: postgres:14-alpine
    container_name: n8n-workflow-postgres
    environment:
      - POSTGRES_DB=n8n_workflow
      - POSTGRES_USER=n8n_user
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
      - ./migrations/n8n-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # Redis para N8N Workflow (gestión de mensajes)
  n8n-redis:
    image: redis:7-alpine
    container_name: n8n-workflow-redis
    command: redis-server --appendonly yes
    volumes:
      - n8n_redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  # Faster-Whisper (Transcripción de Audio)
  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: faster-whisper-server
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=tiny
      - WHISPER_IMPLEMENTATION=faster-whisper
    networks:
      - app-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: automotive-keys-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - app
      - n8n
      - chatwoot
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  n8n_postgres_data:
  n8n_redis_data:
  chatwoot_postgres_data:
  chatwoot_redis_data:
  chatwoot_storage:

networks:
  app-network:
    driver: bridge
